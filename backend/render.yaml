services:
  - type: web
    name: donut-expo-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: REVEL_MOCK
        value: "true"
      - key: REVEL_API_URL
        sync: false
      - key: REVEL_API_KEY
        sync: false
      - key: REVEL_API_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://donut-expo.netlify.app"
